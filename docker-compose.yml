services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: hesab:latest
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - DATABASE_URL=file:/app/data/app.db
      - NODE_ENV=production
      - PORT=3003
    volumes:
      - ./data:/app/data
