services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ID: "${CI_DEPLOY_ID:-$(git rev-parse --short HEAD 2>/dev/null || echo dev)}"
    image: hesab:latest
    restart: unless-stopped
    ports:
      - "3003:3003"
    # Dokploy (createEnvFile) writes its Environment tab into .env next to
    # this file on every deploy. env_file loads it (JWT_SECRET, etc.).
    # Explicit `environment:` below wins on conflict; keep DATABASE_URL here
    # as a safe default so a missing Dokploy env can never point elsewhere.
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/app.db
      - NODE_ENV=production
      - PORT=3003
    volumes:
      # Named volume (NOT ./data): Dokploy re-clones the repo on every deploy,
      # which wipes anything inside the code directory. A named volume survives
      # redeploys, so users/wallets/groups are never lost.
      - hesab-data:/app/data

volumes:
  hesab-data:
    name: hesab-data